name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="v$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match pubspec version $VERSION"
            exit 1
          fi

      - name: Run CI (format, analyze, test)
        run: make ci

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force
