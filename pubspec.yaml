name: scout_flutter
description: Zero-config OpenTelemetry RUM for Flutter. Auto-captures taps, navigation, errors, lifecycle, crashes, performance metrics, network requests, and structured logs.
version: 0.2.2
homepage: https://base14.io
repository: https://github.com/base-14/scout-flutter
issue_tracker: https://github.com/base-14/scout-flutter/issues

topics:
  - opentelemetry
  - observability
  - rum
  - monitoring
  - telemetry

environment:
  sdk: ^3.7.0
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  flutterrific_opentelemetry: ^0.3.2
  dartastic_opentelemetry: ^0.8.6
  fixnum: ^1.1.0
  http: ^1.3.0
  meta: ^1.16.0
  battery_plus: ^7.0.0
  device_info_plus: ^12.1.0
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.0
  dio: ^5.0.0
  package_info_plus: ">=8.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.base14.scout_flutter
        pluginClass: ScoutFlutterPlugin
      ios:
        pluginClass: ScoutFlutterPlugin
